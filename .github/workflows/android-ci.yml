# Android CI — builds and checks the app on every pull request and every push to main.
#
# How it works: GitHub starts a fresh Linux machine (a "runner"), follows the steps below, and
# reports a ✅ or ❌ on the pull request. If any step fails, the run fails and the PR shows why.
#
# It runs the same checks AGENTS.md asks for before a change is called done:
#   unit tests  →  debug build  →  lint (Android's automatic code checker)
#
# No secrets are needed. Without local.properties the Supabase/Google values are blank, so the
# APK it produces builds and installs but cannot sign in. That is fine for checking a PR.

name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab for running it by hand.
  workflow_dispatch:

# A new push to the same PR cancels the older, now-outdated run instead of queueing behind it.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only access to the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  build:
    name: Test, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # AGP 9 needs JDK 17 or newer; 21 is the current long-term-support release.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle downloads between runs (much faster after the first run) and checks that
      # gradle/wrapper/gradle-wrapper.jar is the genuine Gradle file.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, build the debug APK and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace

      # The steps below keep the results for 14 days. Open the run on GitHub, scroll to
      # "Artifacts", and download them. They upload even when an earlier step failed, so the
      # reports explaining the failure are always there.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: datara-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
